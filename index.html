<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game - chess.com</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>♟️ Chess Game ♟️</h1>
            <p>Play Chess Against AI</p>
        </header>

        <div class="game-wrapper">
            <div class="sidebar">
                <div class="info-panel">
                    <h3>Game Status</h3>
                    <div id="status" class="status">White to Move</div>
                    <div id="turn-indicator" class="turn-indicator">
                        <span class="white-turn active">White</span>
                        <span class="black-turn">Black</span>
                    </div>
                </div>

                <div class="controls">
                    <button id="reset-btn" class="btn btn-primary">New Game</button>
                    <button id="undo-btn" class="btn btn-secondary">Undo Move</button>
                    <button id="sound-toggle" class="btn btn-secondary">🔊 Sound On</button>
                </div>

                <div class="captured-pieces">
                    <h3>Captured Pieces</h3>
                    <div class="captured-section">
                        <div class="label">White Captures:</div>
                        <div id="white-captured" class="pieces-list"></div>
                    </div>
                    <div class="captured-section">
                        <div class="label">Black Captures:</div>
                        <div id="black-captured" class="pieces-list"></div>
                    </div>
                </div>

                <div class="move-history">
                    <h3>Move History</h3>
                    <div id="move-list" class="move-list"></div>
                </div>
            </div>

            <div class="board-container">
                <div id="board" class="board"></div>
            </div>
        </div>

        <footer>
            <p>Made with ♥ | Chess Game v1.0</p>
        </footer>
    </div>

    <script src="chess-engine.js"></script>
    <script src="ai.js"></script>
    <script src="app.js"></script>
</body>
</html>
